<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tanga</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F3EFE6;--card:#FFFFFF;--ink:#1C1B18;--mute:#6B665C;--line:#E2DCCD;
  --g:#2E6A4C;--g-ink:#FBFAF6;--g-soft:#D5E7D8;--red:#B4432F;--red-soft:#F6DDD6;--amber:#B97A1E;--amber-soft:#F4E3C9;
  --pl:90%;--pc:38%;--ps:55%;--shadow:0 1px 0 rgba(28,27,24,.08);
}
:root[data-theme=dark]{
  --bg:#14171A;--card:#1E2226;--ink:#EEEBE3;--mute:#9C978B;--line:#2C3237;
  --g:#5FB283;--g-ink:#0F1A14;--g-soft:#1F3A2C;--red:#E38B78;--red-soft:#3B2521;--amber:#E8A860;--amber-soft:#3A2E1B;
  --pl:24%;--pc:30%;--ps:32%;--shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#14171A;--card:#1E2226;--ink:#EEEBE3;--mute:#9C978B;--line:#2C3237;
    --g:#5FB283;--g-ink:#0F1A14;--g-soft:#1F3A2C;--red:#E38B78;--red-soft:#3B2521;--amber:#E8A860;--amber-soft:#3A2E1B;
    --pl:24%;--pc:30%;--ps:32%;--shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.hdr h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--mute)}
.sync.warn{color:var(--amber);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{height:36px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.hero{background:var(--g);color:var(--g-ink);border-radius:20px;padding:18px;margin:6px 0 14px}
:root[data-theme=dark] .hero{background:#234A37;color:#EEEBE3}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:clamp(30px,10vw,38px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0}
.hero .big.over{color:#FFD2C7}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.hero .pill{font-size:13px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:999px;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin:12px 0 6px}
.bar>i{display:block;height:100%;background:#FBFAF6;border-radius:4px}
.hero .sub{font-size:13px;opacity:.9;display:flex;justify-content:space-between;gap:8px}
.hero button.lnk{color:inherit;text-decoration:underline;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cc{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:96px;padding:12px;border-radius:16px;text-align:left;background:var(--c);color:var(--ink);overflow:hidden}
.cc.add{background:transparent;border:1.5px dashed var(--line);align-items:center;justify-content:center;gap:2px;color:var(--mute);font-weight:600}
.cc.add .emo{font-size:22px}
.cc .emo{font-size:26px;line-height:1}
.cc .nm{font-weight:600;font-size:14px;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .am{font-size:13px;color:var(--mute);font-weight:600;min-height:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 16px;border-radius:14px;background:var(--g);color:var(--g-ink);font-weight:600;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{height:40px;width:auto;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:15px}
.mute{color:var(--mute)}
.small{font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.kv+.kv{border-top:1px solid var(--line)}
.pb{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}
.pb>i{display:block;height:100%;background:var(--g);border-radius:4px}
.pb.over>i{background:var(--red)}
.pb.warn>i{background:var(--amber)}
.rowbtn{display:block;width:100%;text-align:left;padding:8px 0}
.rowbtn+.rowbtn{border-top:1px solid var(--line)}
/* yozuvlar */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.mnav button{width:44px;height:44px;border-radius:12px;background:var(--card);font-size:18px}
.mnav b{font-size:17px}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;margin-bottom:10px}
.dh{display:flex;justify-content:space-between;padding:12px 2px 6px;font-size:13px;color:var(--mute);font-weight:600}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;background:var(--card);border-radius:14px;margin-bottom:6px;min-height:56px}
.tx .e{font-size:22px;width:32px;text-align:center}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m span{font-size:12px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;white-space:nowrap}
.tx .a.inc{color:var(--g)}
.tx.x{opacity:.55}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav>div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:480px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;height:52px;justify-content:center;font-size:11px;color:var(--mute);font-weight:600;border-radius:12px}
.nav button i{font-style:normal;font-size:20px;line-height:1}
.nav button.on{color:var(--g)}
/* entry sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.sheet[hidden],#modal[hidden],#toast[hidden]{display:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:8px 12px}
.sh-head .x{width:44px;height:44px;border-radius:12px;background:var(--card);font-size:18px}
.sh-head .t{flex:1;font-weight:700;font-size:17px}
.sh-head .md{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--g-soft);color:var(--g)}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px}
.amt{display:flex;align-items:baseline;gap:6px;justify-content:center;padding-top:6px}
.amt .cur{font-size:26px;color:var(--mute);font-weight:600}
.amt .v{font-size:52px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amt.bad .v{color:var(--red)}
.expr{text-align:center;min-height:20px;color:var(--mute);font-size:14px}
.work{text-align:center;color:var(--g);font-weight:600;font-size:14px;min-height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.chip.dash{border-style:dashed;color:var(--mute)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px;align-items:center}
.quick .chip{height:32px;font-size:13px;background:transparent}
.noteinp{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;margin:6px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.tool{position:relative;height:38px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tool.on{background:var(--g-soft);border-color:var(--g);color:var(--g)}
.tool input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.pad button{height:54px;border-radius:14px;background:var(--card);font-size:22px;font-weight:600;box-shadow:var(--shadow)}
.pad button.op{background:var(--g-soft);color:var(--g)}
.pad button.ok{background:var(--g);color:var(--g-ink);font-size:26px}
.pad button:active{transform:scale(.97)}
.linkbtn{color:var(--red);font-weight:600;padding:10px 0}
/* modal, toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
#modal .box{width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 4px}
#modal input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;margin:10px 0}
#modal .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;background:#1C1B18;color:#F3EFE6;border-radius:14px;padding:12px 14px;z-index:1001;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
#toast button{color:#9BD6B2;font-weight:700;white-space:nowrap}
.fatal{padding:80px 24px;text-align:center}
.fatal h2{margin:8px 0}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.field{display:grid;gap:8px;margin-top:8px}
.field input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;width:100%}

/* ---- ranglar: --c karta, --i ikonka doirasi, --m grafik belgisi (JS ikkala mavzu uchun hisoblaydi) ---- */
[style*="--cl:"]{--c:var(--cl);--i:var(--il);--m:var(--ml)}
:root[data-theme=dark] [style*="--cl:"]{--c:var(--cd);--i:var(--id);--m:var(--md)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) [style*="--cl:"]{--c:var(--cd);--i:var(--id);--m:var(--md)}}
.ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--i);font-size:20px;line-height:1}
.ic.sm{width:34px;height:34px;font-size:17px}
.ic.lg{width:60px;height:60px;font-size:30px}
.inc{color:var(--g)} .exp{color:var(--red)}
/* kalendar */
.cal{background:var(--card);border-radius:16px;padding:10px 8px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.cal .wd,.cal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{text-align:center;font-size:12px;color:var(--mute);font-weight:600;padding:2px 0 6px}
.cd{min-height:54px;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:4px 1px 3px;overflow:hidden;min-width:0}
.cd b{font-size:14px;font-weight:600;line-height:18px}
.cd i{font-style:normal;font-size:9.5px;line-height:12px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.cd .ci{color:var(--g)} .cd .ce{color:var(--red)}
.cd.o{background:transparent;color:var(--mute);opacity:.45}
.cd.t{background:var(--amber-soft)} .cd.t b{color:var(--amber)}
.cd.s{box-shadow:inset 0 0 0 2px var(--ink)}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px 6px 0;margin-top:10px;border-top:1px solid var(--line)}
.sum3>div:nth-child(2){text-align:center} .sum3>div:last-child{text-align:right}
.sum3 span{display:block;font-size:12px;color:var(--mute)} .sum3 b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* kunlar bo'yicha ro'yxat */
.dg{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.dgh{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.dgh .num{display:flex;gap:10px}
.tr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:60px}
.tr+.tr{border-top:1px solid var(--line)}
.tr .m,.cm .m,.cs .m,.sr .m{flex:1;min-width:0}
.tr .m b,.cm .m b,.sr .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .m span,.cm .m span,.sr .m span{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .r,.cs .r{text-align:right;white-space:nowrap}
.tr .r b,.cs .r b{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.tr .r span,.cs .r span{font-size:12px;color:var(--mute)}
.tr.x{opacity:.55}
.fchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;margin:0 0 10px}
/* statistika */
.cardh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.cardh h3{margin:0}
.mini{display:inline-grid;grid-auto-flow:column;background:var(--line);border-radius:9px;padding:2px;gap:2px}
.mini button{height:30px;min-width:40px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--mute)}
.mini button.on{background:var(--card);color:var(--ink)}
.lc{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.lc svg,.dn svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mute);font-size:10px;font-variant-numeric:tabular-nums}
.ln{fill:none;stroke:var(--s);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--s);opacity:.08}
.avg{stroke:var(--mute);stroke-width:1;stroke-dasharray:4 4}
.dt{fill:var(--card);stroke:var(--s);stroke-width:2}
.xh{stroke:var(--mute);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums}
.tip[hidden]{display:none}
.sg{stroke:var(--card);stroke-width:2;cursor:pointer}
.dl{fill:var(--ink);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.ll{stroke:var(--mute);stroke-width:1;fill:none}
.dc1{fill:var(--ink);font-size:17px;font-weight:700;text-anchor:middle;font-variant-numeric:tabular-nums}
.dc2{fill:var(--mute);font-size:11px;text-anchor:middle}
.kpi{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:13px;color:var(--mute)} .kpi b{color:var(--ink);font-variant-numeric:tabular-nums}
.cs{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;color:var(--ink)}
.cs+.cs{border-top:1px solid var(--line)}
.cs .t{display:flex;align-items:center;gap:6px;min-width:0}
.cs .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.cs .pb{height:6px;margin:7px 0 0;background:var(--bg)} .cs .pb>i{background:var(--m)}
.sw{flex:none;width:12px;height:12px;border-radius:4px;background:var(--m)}
.chev{color:var(--mute);font-size:18px;flex:none}
/* boshqaruv panellari */
.sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.sh-body{padding-bottom:24px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;min-height:36px}
.sec h3{margin:0;font-size:15px}
.plus{width:40px;height:40px;border-radius:50%;background:var(--g-soft);color:var(--g);font-size:22px;font-weight:600}
.cm,.sr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:60px}
.cm+.cm,.sr+.sr{border-top:1px solid var(--line)}
.mv{display:flex;gap:6px;flex:none}
.mv button{width:40px;height:40px;border-radius:10px;background:var(--bg);font-size:16px}
.mv button:disabled{opacity:.3}
.fl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:16px 2px 6px}
h3.fl{font-size:13px}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px}
.emorow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.emorow .inp{width:72px;text-align:center;font-size:22px;padding:0 6px}
.emos{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emos button{height:40px;border-radius:10px;background:var(--card);font-size:20px;border:1px solid var(--line)}
.emos button.on{box-shadow:inset 0 0 0 2px var(--ink);border-color:transparent}
.hues{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.hues button{aspect-ratio:1;border-radius:50%;background:var(--m);border:3px solid var(--bg)}
.hues button.on{box-shadow:0 0 0 2px var(--ink)}
.prev{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--c);min-height:88px}
.prev b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:12px;color:var(--mute);margin:8px 2px 0;line-height:1.45}
.rowlink{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;font-weight:600;text-align:left;gap:8px}
.addrow{display:flex;gap:8px;margin-top:4px}
.addrow .btn{width:auto;flex:none}
.opts{display:grid;gap:8px;max-height:60vh;overflow-y:auto;margin-top:12px}
.opts .btn{justify-content:flex-start}
@media (max-width:360px){.mv{gap:4px}.mv button{width:34px;height:40px}.cm,.sr{padding:10px 10px;gap:8px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* ============================ SOZLAMA ============================
   API_URL: Apps Script "Web app" /exec manzili. Bo'sh qoldirsangiz — demo rejim
   (ma'lumot faqat shu brauzerda turadi, hech qayerga yuborilmaydi). */
const API_URL = 'https://script.google.com/macros/s/AKfycbzJLsOkGRLVqfnkv67BoOzoO3unHpxnpZVMLEVV7gGrswY1288bN1th1gXyq4enhYpa/exec';

const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
const DEMO = !API_URL || /[?&]demo=1/.test(location.search);
const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr'];

/* ============================ RANGLAR ============================
   Har kategoriyada rang (OKLCH hue) saqlanadi. Grafiklar uchun 10 ta tekshirilgan rangdan eng yaqini olinadi
   (yorug'lik darajasi har xil — qo'shni rangni ajratish oson). Karta va ikonka shu rangning och varianti. */
const HUE_KEYS = [25, 55, 90, 135, 165, 200, 235, 268, 300, 340];
const SW = { 25: [.76, .14, .64, .14], 55: [.58, .14, .54, .13], 90: [.72, .14, .62, .12], 135: [.6, .14, .66, .14], 165: [.48, .1, .52, .11], 200: [.7, .11, .64, .1], 235: [.56, .11, .52, .11], 268: [.7, .14, .6, .14], 300: [.48, .14, .52, .14], 340: [.58, .14, .62, .14] };

  'Ish haqi': 135, Frilans: 200, Investitsiya: 90, "Sovg'a": 340, 'Olingan qarz': 25 };
function oklch(L, C, h) {
  h = h * Math.PI / 180; const a = C * Math.cos(h), b = C * Math.sin(h);
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3, q = (L - .0894841775 * a - 1.291485548 * b) ** 3;
  const f = x => { x = Math.max(0, Math.min(1, x)); return Math.round((x <= .0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - .055) * 255).toString(16).padStart(2, '0'); };
  return '#' + f(4.0767416621 * l - 3.3077115913 * m + .2309699292 * q) + f(-1.2684380046 * l + 2.6097574011 * m - .3413193965 * q) + f(-.0041960863 * l - .7034186147 * m + 1.707614701 * q);
}
const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
function snapHue(h) { h = ((Number(h) % 360) + 360) % 360; let best = 235, bd = 999; HUE_KEYS.forEach(k => { const d = Math.min(Math.abs(k - h), 360 - Math.abs(k - h)); if (d < bd) { bd = d; best = k; } }); return best; }
const hueOf = c => c && c.rang !== undefined && c.rang !== '' && c.rang !== null ? Number(c.rang) : (c && DEF_HUE[c.nom] !== undefined ? DEF_HUE[c.nom] : 235);
const colCache = {};
function cols(h, dark) {
  const k = snapHue(h), d = dark === undefined ? isDark() : dark, key = k + (d ? 'd' : 'l');
  if (colCache[key]) return colCache[key];
  const w = SW[k];
  return (colCache[key] = { mark: oklch(d ? w[2] : w[0], d ? w[3] : w[1], k), card: oklch(d ? .29 : .955, .035, k), icon: oklch(d ? .38 : .87, d ? .06 : .075, k) });
}
/** Ikkala mavzu uchun ham qiymat beriladi — CSS hozirgisini tanlaydi (mavzu jonli o'zgarsa ham to'g'ri). */
const cst = c => { const h = hueOf(c), L = cols(h, false), D = cols(h, true); return '--cl:' + L.card + ';--il:' + L.icon + ';--ml:' + L.mark + ';--cd:' + D.card + ';--id:' + D.icon + ';--md:' + D.mark; };

function shades(h, n) {
  const k = snapHue(h), w = SW[k], d = isDark();
  if (n <= 1) return [cols(k).mark];
  const lo = d ? .42 : .40, hi = d ? .78 : .82;
  return Array.from({ length: n }, (_, i) => oklch(lo + (hi - lo) * i / (n - 1), d ? w[3] : w[1], k));
}
const nextHue = tur => nextHueIn(S.cats[tur]);

/* ============================ KATEGORIYA AMALLARI ============================
   Bitta funksiya: ilovaning o'z holatiga (darhol, oflayn ham) va demo "server"ga bir xil qo'llanadi.
   Backend'dagi apiCatSave_/apiCatDel_/... bilan bir xil ma'noda. */
const CAT_OPS = ['cat', 'catSave', 'catDel', 'catOrder', 'subRen', 'subDel'];
const lc = x => String(x).toLowerCase();
function catOps(db, a, d) {
  const tur = d.tur === 'inc' ? 'inc' : 'exp', L = db.cats[tur], rec = db.recurring || [];
  const find = n => L.find(c => c.nom === n);
  const renameCat = (from, to) => { db.entries.forEach(e => { if (e.tur === tur && e.kategoriya === from) e.kategoriya = to; }); rec.forEach(r => { if (r.tur === tur && r.kategoriya === from) r.kategoriya = to; }); };
  if (a === 'cat' || a === 'catSave') {
    const c = find(d.old !== undefined ? d.old : d.nom);
    if (!c) {
      if (d.old) return;
      L.push({ nom: d.nom, emoji: d.emoji || '📦', subs: (d.subs || []).slice(), limit: +d.limit || 0, hisob: d.hisob || 'sarf', rang: d.rang !== undefined ? d.rang : nextHueIn(L) });
      return;
    }
    if (d.nom && d.nom !== c.nom) { renameCat(c.nom, d.nom); c.nom = d.nom; }
    if (d.emoji) c.emoji = d.emoji;
    if (d.hisob) c.hisob = d.hisob;
    if (d.rang !== undefined && d.rang !== '') c.rang = +d.rang;
    if (d.limit !== undefined && d.limit !== '') c.limit = +d.limit || 0;
    if (Array.isArray(d.subs)) c.subs = d.subs.slice();
    if (d.faol !== undefined) { if (d.faol) delete c.arx; else c.arx = 1; }
  } else if (a === 'catDel') {
    const c = find(d.nom); if (!c) return;
    if (d.to) {
      const t = find(d.to); if (!t || t === c) return;
      renameCat(c.nom, t.nom);
      c.subs.forEach(x => { if (!t.subs.some(y => lc(y) === lc(x))) t.subs.push(x); });
      delete t.arx; L.splice(L.indexOf(c), 1);
    } else if (db.entries.some(e => e.tur === tur && e.kategoriya === c.nom) || rec.some(r => r.tur === tur && r.kategoriya === c.nom)) c.arx = 1;
    else L.splice(L.indexOf(c), 1);
  } else if (a === 'catOrder') {
    const pos = c => { const i = (d.order || []).indexOf(c.nom); return i < 0 ? 1000 + L.indexOf(c) : i; };
    const sorted = L.slice().sort((x, y) => pos(x) - pos(y)); L.length = 0; sorted.forEach(c => L.push(c));
  } else if (a === 'subRen') {
    const c = find(d.cat); if (!c) return;
    let nom = d.nom; const i = c.subs.indexOf(d.old), other = c.subs.find((x, j) => j !== i && lc(x) === lc(nom));
    if (other) { if (i >= 0) c.subs.splice(i, 1); nom = other; } else if (i >= 0) c.subs[i] = nom; else c.subs.push(nom);
    db.entries.forEach(e => { if (e.tur === tur && e.kategoriya === c.nom && e.sub === d.old) e.sub = nom; });
    rec.forEach(r => { if (r.tur === tur && r.kategoriya === c.nom && r.sub === d.old) r.sub = nom; });
    return nom;
  } else if (a === 'subDel') {
    const c = find(d.cat); if (c) c.subs = c.subs.filter(x => x !== d.nom);
  }
}
function nextHueIn(L) { const used = {}; L.forEach(c => { const k = snapHue(hueOf(c)); used[k] = (used[k] || 0) + 1; }); return HUE_KEYS.slice().sort((a, b) => (used[a] || 0) - (used[b] || 0))[0]; }
const cleanSub = v => String(v || '').replace(/,/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 30);

}

/* ============================ API + OFFLINE NAVBAT ============================ */
const FATAL = { auth: 'Sessiya tasdiqlanmadi', eskirgan: 'Sessiya eskirdi', "ruxsat yo'q": "Bu ilova faqat egasi uchun", sozlanmagan: 'Backend sozlanmagan (BOT_TOKEN / OWNER_ID)' };
async function callApi(action, data) {
  if (DEMO) { await new Promise(r => setTimeout(r, 120)); return demo.api(action, data || {}); }
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 25000);
  let j;
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, data: data || {}, initData: tg ? tg.initData : '' }), signal: ctrl.signal, redirect: 'follow' });
    j = await res.json();
  } catch (e) { const er = new Error('net'); er.net = true; throw er; } finally { clearTimeout(to); }
  if (!j || !j.ok) { const er = new Error((j && j.error) || 'server'); er.server = true; throw er; }
  return j.data;
}
const saveOutbox = () => lsSet('tanga_outbox', outbox);
function queue(a, d) { outbox.push({ a, d }); saveOutbox(); flush(); }
async function flush() {
  if (flushing) return;
  flushing = true;
  let reload = false;
  try {
    while (outbox.length) {
      const op = outbox[0];
      try { await callApi(op.a, op.d); outbox.shift(); saveOutbox(); S.online = true; }
      catch (e) {
        if (e.net || e.message === 'server') { S.online = false; break; }
        if (FATAL[e.message]) { S.fatal = e.message; break; }
        outbox.shift(); saveOutbox(); reload = true; toast('⚠ ' + e.message);
      }
    }
  } finally { flushing = false; }
  if (reload) return boot();
  if (S.ready) renderSync();
}
window.addEventListener('online', () => flush());
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); } });

function persist() { lsSet('tanga_cache', { cats: S.cats, entries: S.entries, settings: S.settings, recurring: S.recurring, wishes: S.wishes, marks: S.marks, tz: S.tz, sheetUrl: S.sheetUrl, from: S.from }); }
function applyOutbox() {
  outbox.forEach(op => {
    if (op.a === 'add' && !S.entries.find(e => e.id === op.d.id)) S.entries.push(Object.assign({ ish_daq: Math.round(op.d.summa / rate() * 60) }, op.d));
    else if (op.a === 'upd') { const e = S.entries.find(x => x.id === op.d.id); if (e) Object.assign(e, op.d); }
    else if (op.a === 'del') S.entries = S.entries.filter(e => e.id !== op.d.id);
    else if (op.a === 'set') Object.assign(S.settings, Object.fromEntries(Object.entries(op.d).map(([k, v]) => [k, String(v)])));
    else if (CAT_OPS.indexOf(op.a) >= 0) catOps(S, op.a, op.d);
  });
}
async function boot(from) {
  await flush();
  try {
    const d = await callApi('boot', from ? { from } : {});
    S.tz = d.tz || S.tz; S.cats = d.cats; S.settings = Object.assign(S.settings, d.settings); S.entries = d.entries;
    S.recurring = d.recurring || []; S.wishes = d.wishes || []; S.marks = d.marks || []; S.sheetUrl = d.sheetUrl || ''; S.from = d.from || '';
    S.online = true;
    applyOutbox(); persist();
  } catch (e) {
    if (FATAL[e.message]) S.fatal = e.message; else S.online = false;
  }
  S.ready = true;
  render();

/**

function pCatStat(tur, nom) {
  const ym = S.month;
  return {
    title() { const c = catOf(tur, nom); return esc((c ? c.emoji + ' ' : '') + nom); },
    body() {
      const all = monthEntries(ym).filter(e => e.tur === tur && e.kategoriya === nom).sort(byNewest), inc = all.filter(counts);
      const total = inc.reduce((a, e) => a + e.summa, 0), by = {}, n = {};
      inc.forEach(e => { const k = e.sub || ''; by[k] = (by[k] || 0) + e.summa; n[k] = (n[k] || 0) + 1; });
      const rows = Object.keys(by).map(k => ({ k, v: by[k], n: n[k] })).sort((a, b) => b.v - a.v);
      const cols6 = shades(hueOf(catOf(tur, nom) || { nom }), Math.min(rows.length, 6)), grey = isDark() ? '#6b6f73' : '#a8a49b';
      const name = r => r.k || 'Ichki tursiz', short = t => t.length > 10 ? t.slice(0, 9) + '…' : t;
      const segs = rows.slice(0, 6).map((r, i) => ({ v: r.v, col: cols6[i], lab: short(name(r)) + ' ' + pfmt(r.v / total * 100) }));
      const rest = rows.slice(6).reduce((a, r) => a + r.v, 0);

  wishSkip(el) { const w = S.wishes.find(x => x.id === el.dataset.id); if (!w) return; w.holat = 'voz'; queue('wishSet', { id: w.id, holat: 'voz' }); persist(); render(); haptic('ok'); toast('Barakalla! ' + won(w.summa) + ' tejaldi'); },
  wishBuy(el) {
    const w = S.wishes.find(x => x.id === el.dataset.id); if (!w) return;
    w.holat = 'olindi'; queue('wishSet', { id: w.id, holat: 'olindi' }); persist();
    S.tab = 'home'; S.mode = 'exp'; render();
    const x = catOf('exp', 'Xarid'), cat = x && !x.arx ? 'Xarid' : (activeCats('exp').find(c => c.hisob === 'sarf') || activeCats('exp')[0]).nom;
    openEntry({ mode: 'exp', cat, prefill: { expr: String(w.summa), note: w.nom } });
  },
  recOff(el) { S.recurring = S.recurring.filter(r => r.id !== el.dataset.id); queue('subOff', { id: el.dataset.id }); persist(); render(); },
  sheet() { if (tg && tg.openLink) tg.openLink(S.sheetUrl); else window.open(S.sheetUrl, '_blank'); },
  async sync() { toast('Yangilanmoqda…'); await boot(S.full ? '2000-01-01' : undefined); toast('✓ Yangilandi'); },
  demoReset() { try { localStorage.removeItem('tanga_demo'); } catch (e) {} demo.db = null; boot(); }
};
async function loadMonth() {
  if (!S.full && S.from && S.month + '-01' < S.from) { render(); await boot(S.month + '-01'); }
  else render();
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (el && A[el.dataset.act]) A[el.dataset.act](el, ev);
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'q') { S.q = ev.target.value; const b = $('#listbody'); if (b) b.innerHTML = vListBody(); return; }
  const k = ev.target.dataset && ev.target.dataset.bind, p = topPanel();
  if (k && p && p.st) { p.st[k] = ev.target.value; if (p.live) p.live(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.bind === 'add') A.smAdd();
});
document.addEventListener('pointerdown', lineHover);
document.addEventListener('pointermove', lineHover);

/* ============================ ISHGA TUSHIRISH ============================ */
function applyTheme() {
  if (!tg) return;
  document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
  const bg = tg.colorScheme === 'dark' ? '#14171A' : '#F3EFE6';
  try { tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch (e) {}
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => refresh()); } catch (e) {}
(function init() {
  if (tg) {
    try {
      tg.ready(); tg.expand();
      if (tg.BackButton) tg.BackButton.onClick(onBack);
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      applyTheme();
      if (tg.onEvent) tg.onEvent('themeChanged', () => { applyTheme(); refresh(); });
    } catch (e) {}
  }
  outbox = lsGet('tanga_outbox', []);
  const c = lsGet('tanga_cache', null);
  if (c && !DEMO) { Object.assign(S, { cats: c.cats, entries: c.entries, settings: Object.assign(S.settings, c.settings), recurring: c.recurring || [], wishes: c.wishes || [], marks: c.marks || [], tz: c.tz || S.tz, sheetUrl: c.sheetUrl || '', from: c.from || '' }); applyOutbox(); S.ready = true; }
  render();
  boot();
})();
</script>
